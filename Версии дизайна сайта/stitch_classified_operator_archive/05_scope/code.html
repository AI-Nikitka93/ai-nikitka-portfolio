        }
        /* Custom styles to enforce rigid borders and spacing where Tailwind utilities are insufficient for the exact aesthetic */
        .cyber-border {
            border: 2px solid theme('colors.outline');
        }
        .cyber-border-thick {
            border: 4px solid theme('colors.primary-fixed');
        }
        .cyber-focus:focus-within {
            border-color: theme('colors.primary-fixed');
            outline: none;
        }
        .cyber-shadow {
            box-shadow: 4px 4px 0px 0px theme('colors.primary-fixed');
        }

            transform: translate(4px, 4px);
        }
        .cyber-shadow-error {
            box-shadow: 4px 4px 0px 0px theme('colors.error');

</div>

<!-- Intake Terminal Container -->
<div class="w-full max-w-4xl cyber-border-thick bg-surface-container p-sm md:p-md flex flex-col gap-md relative">
<!-- System Label -->
<div class="absolute -top-[14px] left-sm bg-primary-fixed text-on-primary-fixed font-label-bold text-label-bold px-xs py-[2px] border-2 border-primary-fixed uppercase tracking-widest">

            </div>
<!-- Terminal Header -->
<div class="border-b-2 border-outline pb-sm flex justify-between items-end">
<div>
<h1 class="font-h2 text-h2 text-primary uppercase tracking-tighter">MISSION_SCOPE_ACQUISITION</h1>
<p class="font-metadata text-metadata text-on-surface-variant uppercase mt-xs">ENTER MISSION PARAMETERS // AWAITING INPUT...</p>
</div>
<div class="hidden md:flex gap-xs">
<span class="w-3 h-3 bg-error rounded-full animate-pulse"></span>
<span class="font-metadata text-metadata text-error uppercase">REC</span>
</div>

<!-- Intake Form Grid -->
<form class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<!-- Objective Input -->
<div class="md:col-span-2 flex flex-col gap-xs">

<input class="bg-transparent border-none w-full font-body text-body text-on-surface focus:ring-0 placeholder:text-outline p-0 cyber-input" placeholder="DEFINE_TARGET_OUTCOME..." type="text"/>
</div>
</div>

<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="threat" type="radio"/>

</label>
<label class="cursor-pointer relative">

                            </div>

</div>

<option value="minimal">MINIMAL_OP [1-2 PAX]</option>
<option selected="" value="standard">STANDARD_OP [3-5 PAX]</option>
<option value="heavy">HEAVY_ASSAULT [6+ PAX]</option>
</select>
